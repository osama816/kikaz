<section #splashEl class="splash-wrap">

  <!-- Checker borders top & bottom (brand identity) -->
  <div class="splash-checker-top"></div>
  <div class="splash-checker-bot"></div>

  <!-- Halftone texture (red dots on white) -->
  <div class="splash-halftone"></div>

  <!-- OH SO GOOD badge -->
  <div class="splash-badge ohsogood-wrap">
    <div class="ohsogood-badge">
      <span>OH<br>SO<br>GOOD</span>
    </div>
  </div>

  <!-- Floating sparkles (red) -->
  <span class="splash-spark s1">✦</span>
  <span class="splash-spark s2">◆</span>
  <span class="splash-spark s3">✦</span>
  <span class="splash-spark s4">◆</span>

  <!-- KIKAZ letters -->
  <div class="splash-logo-wrap">
    <span class="letter">K</span>
    <span class="letter">I</span>
    <span class="letter">K</span>
    <span class="letter">A</span>
    <span class="letter">Z</span>
  </div>

  <!-- Subtitle -->
  <div class="subtitle">
    <div class="sub-pill">WRAPS &amp; SNACKS</div>
  </div>

  <!-- Animated wrap illustration -->
  <div class="splash-wrap-icon">
    <img src="/hero_wrap_3d.png" alt="KIKAZ Wrap" class="splash-wrap-img">
  </div>

</section>
